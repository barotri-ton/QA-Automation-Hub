name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run offline backend tests
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p test-results/backend
          python -m pytest -q backend/tests --junitxml=test-results/backend/junit.xml
      - name: Publish backend test summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/backend/junit.xml ]; then
            python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results/backend/junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("### Backend pytest\n\n")
              output.write(" | ".join(f"{k}: {v}" for k, v in totals.items()) + "\n")
          PY
          else
            echo "Backend tests did not produce JUnit XML (setup or collection failure)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backend JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: test-results/backend/junit.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript and Vite build
        working-directory: frontend
        run: npm run build
      - name: Publish frontend result
        if: always()
        shell: bash
        run: |
          if [ -d frontend/dist ]; then
            echo "### Frontend\n\nTypeScript and Vite build: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Frontend\n\nBuild output missing; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

  windows-offline:
    name: Windows offline backend tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline tests only (no Jira/NBR E2E)
        env:
          PYTHONPATH: backend
        run: |
          New-Item -ItemType Directory -Force -Path test-results/windows | Out-Null
          python -m pytest -q backend/tests --junitxml=test-results/windows/junit.xml
      - name: Upload Windows JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-junit
          path: test-results/windows/junit.xml
          if-no-files-found: warn
          retention-days: 14
